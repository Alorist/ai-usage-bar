; AI Usage Bar (Taskbar) - Claude / Codex plan limits and token value at a glance.
; Sits on the taskbar left of the tray; hidden while something is fullscreen.
; Generated by tools/gen_skins.py - edit that instead of this file.

[Rainmeter]
Update=30000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!WriteKeyValue Watch active 1 "#FlagFile#"][!Draggable 0][!ZPos 2]["#Exe#" helper --config "#CURRENTCONFIG#" --ini "#CURRENTPATH##CURRENTFILE#" --flag "#FlagFile#" --rainmeter "#PROGRAMPATH#Rainmeter.exe"]
OnCloseAction=[!WriteKeyValue Watch active 0 "#FlagFile#"]
ContextTitle=Refresh usage now
ContextAction=[!CommandMeasure MeasureRun "Run"]
ContextTitle2=Show as desktop bar instead
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#" "Mini.ini"]
ContextTitle3=Open data folder
ContextAction3=["#DataDir#"]

[Metadata]
Name=AI Usage Bar (Taskbar)
Author=Alorist
Information=Shows Claude and Codex subscription limits and token usage. Hover a section for reset times and details.
Version=1.0.0
License=MIT

[Variables]
Variant=Taskbar
Exe=#@#bin\aiusage\aiusage.exe
DataDir=#@#data
DataFile=#@#data\rainmeter_data.txt
FlagFile=#@#taskbar_active.flag
UpdatedColor=255,255,255,105
CLX=18
CXX=374
TKX=726
Div1X=356
Div2X=708
BgW=900
TKOn=0
TodayShort=-
WeekShort=-
TokTip=waiting for data
CLDot=255,255,255,105
CLTip=waiting for data
CLPct1=-
CLPctColor1=255,255,255,240
CLW1=6
CLFill1=0,0,0,0
CLPct2=-
CLPctColor2=255,255,255,240
CLW2=6
CLFill2=0,0,0,0
CXDot=255,255,255,105
CXTip=waiting for data
CXPct1=-
CXPctColor1=255,255,255,240
CXW1=6
CXFill1=0,0,0,0
CXPct2=-
CXPctColor2=255,255,255,240
CXW2=6
CXFill2=0,0,0,0

; ---------------------------------------------------------------- measures

[MeasureScript]
Measure=Script
ScriptFile=#@#AIUsage.lua

; counts skin updates 1..10 (30 s each): fetch at load and every 5 minutes
[MeasureCollect]
Measure=Calc
Formula=(MeasureCollect % 10) + 1
IfCondition=MeasureCollect = 1
IfTrueAction=[!CommandMeasure MeasureRun "Run"]

; runs the fetch, then redraws as soon as it finishes
[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program="#Exe#"
Parameter=collect --data-dir "#DataDir#"
State=Hide
FinishAction=[!CommandMeasure MeasureScript "Refresh()"][!UpdateMeter *][!Redraw]

; ------------------------------------------------------------------ styles

[sText]
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255,235
AntiAlias=1
StringAlign=LeftCenter
Y=16
DynamicVariables=1

[sDim]
FontColor=255,255,255,140

[sBold]
StringStyle=Bold

; ------------------------------------------------------------------ meters

[Bg]
Meter=Shape
X=0
Y=0
DynamicVariables=1
Shape=Rectangle 0.5,0.5,(#TKOn# = 1 ? [WeekVal:X]+[WeekVal:W]+18 : #BgW#),31,15.5 | Fill Color 12,16,22,185 | Stroke Color 255,255,255,30 | StrokeWidth 1

